<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Убегающая курица</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="scene">
    <div id="chicken">
      <svg id="chickenSvg" viewBox="0 0 240 200" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="60%" y2="100%">
            <stop offset="0%" stop-color="#f3c072"/>
            <stop offset="100%" stop-color="#c97a34"/>
          </linearGradient>
        </defs>

        <g class="tail">
          <path d="M60,100 C40,90 15,75 8,45 C25,55 45,68 62,88 Z" fill="#f5e6c8"/>
          <path d="M62,105 C45,98 25,88 18,60 C33,68 50,80 66,96 Z" fill="#e3b46a"/>
          <path d="M65,112 C50,108 35,100 30,80 C42,86 55,96 68,104 Z" fill="#c98f4a"/>
        </g>

        <g class="legs">
          <g class="leg-hip" transform="translate(102,148)">
            <g class="leg-rotator leg-back">
              <line class="leg-bone" x1="0" y1="0" x2="-2" y2="34"/>
              <g class="foot" transform="translate(-2,34)">
                <line x1="0" y1="0" x2="-9" y2="7"/>
                <line x1="0" y1="0" x2="0" y2="10"/>
                <line x1="0" y1="0" x2="9" y2="7"/>
              </g>
            </g>
          </g>
          <g class="leg-hip" transform="translate(146,148)">
            <g class="leg-rotator leg-front">
              <line class="leg-bone" x1="0" y1="0" x2="2" y2="34"/>
              <g class="foot" transform="translate(2,34)">
                <line x1="0" y1="0" x2="-9" y2="7"/>
                <line x1="0" y1="0" x2="0" y2="10"/>
                <line x1="0" y1="0" x2="9" y2="7"/>
              </g>
            </g>
          </g>
        </g>

        <path class="body" d="M50,150 C25,150 20,110 40,90 C55,72 85,60 115,62 C140,64 160,72 172,85 C182,96 188,112 184,128 C180,148 155,162 125,163 C95,164 65,160 50,150 Z" fill="url(#bodyGrad)"/>

        <ellipse class="belly" cx="108" cy="140" rx="42" ry="20" fill="#f6dfa8" opacity="0.55"/>

        <path class="wing" d="M80,85 C100,78 125,80 140,92 C125,100 100,102 82,96 Z" fill="#b9702f" opacity="0.55"/>

        <circle class="head" cx="185" cy="70" r="26" fill="url(#bodyGrad)"/>

        <path class="comb" d="M168,48 C170,38 176,34 180,42 C182,34 190,32 192,42 C196,34 204,34 204,44 C202,52 190,54 180,52 C174,52 169,54 168,48 Z" fill="#e0453f"/>

        <path class="wattle" d="M196,86 C200,92 200,100 194,102 C190,98 190,90 196,86 Z" fill="#d43a35"/>

        <path class="beak" d="M206,66 L224,72 L206,80 Z" fill="#f2b705"/>

        <circle class="eye" cx="193" cy="64" r="3" fill="#2b1a0f"/>
      </svg>
    </div>
    <div id="score">Испугов: <span id="scoreValue">0</span></div>
    <div id="hint">Попробуй поймать курицу курсором мыши!</div>
  </div>
  <div id="startOverlay">
    <button id="startButton" type="button">🔊 Нажми, чтобы начать</button>
  </div>
  <script src="script.js"></script>
</body>
</html>
